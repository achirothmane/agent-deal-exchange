name: Verify imported Medusa baseline

on:
  push:
    branches:
      - d1/medusa-source-import
    paths:
      - '.github/workflows/verify-medusa-baseline.yml'
      - 'substrates/medusa-b2b/**'

permissions:
  contents: read

jobs:
  medusa-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: medusa_b2b
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d medusa_b2b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: substrates/medusa-b2b

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/medusa_b2b
      DB_NAME: medusa_b2b
      STORE_CORS: http://localhost:8000
      ADMIN_CORS: http://localhost:9000
      AUTH_CORS: http://localhost:9000
      JWT_SECRET: test-only-jwt-secret-not-for-production
      COOKIE_SECRET: test-only-cookie-secret-not-for-production

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: pnpm
          cache-dependency-path: substrates/medusa-b2b/pnpm-lock.yaml
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify backend builds
        run: pnpm --filter @b2b-starter/backend build
      - name: Verify baseline quote integration
        run: |
          cd apps/backend
          TEST_TYPE=integration:http NODE_OPTIONS=--experimental-vm-modules \
            pnpm exec jest integration-tests/http/quotes/quotes.spec.ts --runInBand --forceExit
